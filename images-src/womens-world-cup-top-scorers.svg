<text x="382" y="610" font-size="23" font-weight="700" fill="#1d2420" text-anchor="end">Bettina Wiegmann</text>
<text x="382" y="636" font-size="17" fill="#5d6862" text-anchor="end">Germany</text>
<rect x="400" y="588" width="440" height="40" rx="4" fill="#4f7d68"/>
<text x="852" y="616" font-size="24" font-weight="700" fill="#1d2420">11</text>
<text x="400" y="716" font-size="17" fill="#5d6862">Goals at FIFA Women's World Cup final tournaments. Brazilian players in orange.</text>
<text x="70" y="752" font-size="16" fill="#8a958f">Sources: FIFA (top four); others from Opta (The Analyst), cross-checked with Goal and Just Women's Sports.</text>
<text x="70" y="776" font-size="16" fill="#8a958f">Original graphic by Brazil 2027 Fan Guide, an independent fan site not affiliated with FIFA.</text>
