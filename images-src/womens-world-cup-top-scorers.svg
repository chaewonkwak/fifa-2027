<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
<title>Women's World Cup all-time top scorers, 1991–2023</title>
<rect width="1200" height="800" fill="#fbfcfb"/>
<text x="70" y="62" font-size="38" font-weight="700" fill="#1d2420">Women's World Cup all-time top scorers</text>
