<text x="382" y="492" font-size="17" fill="#5d6862" text-anchor="end">Brazil</text>
<rect x="400" y="444" width="440" height="40" rx="4" fill="#d9822b"/>
<text x="852" y="472" font-size="24" font-weight="700" fill="#1d2420">11</text>
<text x="382" y="538" font-size="23" font-weight="700" fill="#1d2420" text-anchor="end">Sun Wen</text>
<text x="382" y="564" font-size="17" fill="#5d6862" text-anchor="end">China</text>
